<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- 书本 -->
  <g transform="translate(256,220)">
    <!-- 书脊 -->
    <rect x="-8" y="-80" width="16" height="180" rx="3" fill="#92400E"/>
    <!-- 左页 -->
    <path d="M-8,-80 L-120,-60 L-120,80 L-8,100 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
    <!-- 右页 -->
    <path d="M8,-80 L120,-60 L120,80 L8,100 Z" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
    <!-- 书签 -->
    <path d="M-3,20 L-30,35 L-3,50 Z" fill="#EF4444"/>
    <!-- 文字线条 -->
    <line x1="-80" y1="-20" x2="-20" y2="-10" stroke="#D1D5DB" stroke-width="4" stroke-linecap="round"/>
    <line x1="-75" y1="0" x2="-20" y2="5" stroke="#D1D5DB" stroke-width="4" stroke-linecap="round"/>
    <line x1="-70" y1="20" x2="-20" y2="22" stroke="#D1D5DB" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="-15" x2="80" y2="-5" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="5" x2="75" y2="10" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="25" x2="70" y2="28" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- 时钟图标 -->
  <g transform="translate(256,400)">
    <circle cx="0" cy="0" r="55" fill="white" opacity="0.15"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="white" stroke-width="4" opacity="0.8"/>
    <line x1="0" y1="0" x2="0" y2="-28" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="0" y1="0" x2="20" y2="10" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="0" cy="0" r="5" fill="white"/>
  </g>
</svg>
